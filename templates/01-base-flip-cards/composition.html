<head>

  <meta name="viewport" content="width=1920, height=1080" />
  <title>Base 01 - Voice-Paced Flip Cards</title>
  <style>

    .unit-dot { width: 18px; height: 18px; background: var(--accent); border-radius: 50%; }
    .kicker { position: absolute; left: 332px; top: 184px; color: var(--accent); font-size: 32px; font-weight: 900; text-transform: uppercase; }

    @keyframes fromRight { from { opacity: 0; transform: translateX(110px); } to { opacity: 1; transform: translateX(0); } }

</head>
<body>
  <main class="stage" data-composition-id="01-base-flip-cards" data-width="1920" data-height="1080" data-duration="10">
    <img class="plate" alt="" />

    <div class="unit"><span class="unit-dot"></span><span>Hyperslides Variable Catalog</span></div>
    <div class="kicker"></div>
    <h1></h1>
    <div class="question"></div>
    <section class="demo"></section>
    <footer class="footer"><span class="footer-text"></span><span class="progress">01/14</span></footer>
  </main>
  <script>
    const defaults = {
    "title": "Base 01 - Voice-Paced Flip Cards",
    "kicker": "Locked baseline",
    "question": "Does this remain the default ACS module-intro feel?",
    "accentColor": "#2f765f",
    "basePlateUrl": "../assets/1.png",
    "footerText": "Review one style at a time",
    "showQuestion": true,
    "cardOneFront": "Front captions hold for voice start",
    "cardOneBack": "Cards flip into learner-facing detail after the voice start.",
    "cardTwoFront": "Cards flip into detail",
    "cardTwoBack": "Outro and plate rules stay locked for ACS production use."
};
    const values = { ...defaults, ...(window.__hyperframes?.getVariables?.() ?? {}) };
    const root = document.querySelector('[data-composition-id="01-base-flip-cards"]');
    root.style.setProperty('--accent', values.accentColor);
    root.querySelector('.plate').src = values.basePlateUrl;
    root.querySelector('.kicker').textContent = values.kicker;
    root.querySelector('h1').textContent = values.title;
    root.querySelector('.question').textContent = values.showQuestion ? values.question : '';
    root.querySelector('.footer-text').textContent = values.footerText;
    root.querySelector('.demo').innerHTML = '<div class="flip-wrap"><article class="flip-card" style="--delay:.25s"><div class="front"></div><div class="back"></div></article><article class="flip-card" style="--delay:1.25s"><div class="front"></div><div class="back"></div></article></div>';
    const cards = root.querySelectorAll('.flip-card');
    cards[0].querySelector('.front').textContent = values.cardOneFront; cards[0].querySelector('.back').textContent = values.cardOneBack;
    cards[1].querySelector('.front').textContent = values.cardTwoFront; cards[1].querySelector('.back').textContent = values.cardTwoBack;
