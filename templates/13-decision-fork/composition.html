<head>

  <meta name="viewport" content="width=1920, height=1080" />
  <title>Decision Fork</title>

    @keyframes fromRight { from { opacity: 0; transform: translateX(110px); } to { opacity: 1; transform: translateX(0); } }

    const defaults = {

    "accentColor": "#2f765f",
    "basePlateUrl": "../assets/1.png",

    "goodColor": "#22c55e",
    "badColor": "#ef4444"
